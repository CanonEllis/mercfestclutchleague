<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Clubhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090F; --sub:rgba(235,240,255,.58); --text:#F5F7FB; --faint:rgba(235,240,255,.38);
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --edge:rgba(255,255,255,.12); --edge-2:rgba(255,255,255,.22);
  --blue:#5AA9FF; --gold:#F5C86B; --win:#4CD98A; --loss:#FF6B6B; --push:#9AA3B2;
  --r:20px; --r-s:12px;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
body{min-height:100vh;background:
    radial-gradient(60% 50% at 15% 10%, rgba(70,110,255,.42), transparent 70%),
    radial-gradient(45% 45% at 85% 5%, rgba(160,80,255,.34), transparent 70%),
    radial-gradient(50% 45% at 75% 95%, rgba(0,190,200,.25), transparent 70%),
    radial-gradient(40% 40% at 10% 90%, rgba(255,140,90,.18), transparent 70%),
    var(--bg);background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* glass primitives */
.card,.board,.trophy,.dcell,header .hbar-glass,.setup{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 20px 50px -30px rgba(0,0,0,.8)}
.card{padding:20px}

/* header */
header{position:sticky;top:0;z-index:10;backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);background:rgba(7,9,15,.55);border-bottom:1px solid var(--edge)}
.hbar{display:flex;align-items:center;gap:14px;padding:14px 0 0}
.hbar .avatar{width:44px;height:44px;border-radius:12px;background:var(--glass-2);object-fit:cover;border:1px solid var(--edge)}
.hbar h1{font-weight:600;font-size:24px;line-height:1.15;margin:0;letter-spacing:-.02em}
.hbar .sub{color:var(--sub);font-size:14px;margin-top:1px}
nav{display:flex;gap:2px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;border:0;color:var(--sub);font-size:15px;font-weight:500;padding:8px 14px;border-radius:999px;white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{color:var(--text);background:var(--glass)}
nav button.on{color:var(--text);background:var(--glass-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
nav button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

main{padding:34px 0 72px}
section[hidden]{display:none}
h2{font-weight:600;font-size:34px;letter-spacing:-.03em;margin:0 0 16px;line-height:1.1}
h3{font-weight:600;font-size:19px;letter-spacing:-.01em;margin:0 0 12px;line-height:1.2}
.muted{color:var(--sub)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{justify-content:space-between}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--glass-2);border:1px solid var(--edge);color:var(--text)}
.pill.win{background:rgba(76,217,138,.14);color:var(--win);border-color:rgba(76,217,138,.3)}
.pill.loss{background:rgba(255,107,107,.14);color:var(--loss);border-color:rgba(255,107,107,.3)}
.pill.brass{background:rgba(245,200,107,.14);color:var(--gold);border-color:rgba(245,200,107,.35)}
select,input{font-family:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--edge);border-radius:var(--r-s);background:var(--glass);color:var(--text);backdrop-filter:blur(12px)}
select option{background:#151926;color:var(--text)}
input::placeholder{color:var(--faint)}
.btn{background:var(--text);color:#0B0E17;border:0;border-radius:999px;padding:10px 20px;font-size:15px;font-weight:600;transition:transform .12s,opacity .15s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.97)}
.btn.brass{background:linear-gradient(135deg,#8FC3FF,#5AA9FF);color:#061126}
.btn.ghost{background:var(--glass-2);color:var(--text);border:1px solid var(--edge)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}h2{font-size:28px}}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:500;color:var(--sub);font-size:13px;padding:10px 12px;border-bottom:1px solid var(--edge)}
td{padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
td:has(> .team){width:100%;max-width:0}
@media (max-width:640px){th,td{padding-left:8px;padding-right:8px;font-size:14px}td.num{font-size:15px}}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.team img{width:32px;height:32px;border-radius:9px;background:var(--glass-2);flex:none;border:1px solid var(--edge)}
.team .n{font-weight:600;line-height:1.15}
.team .o{font-size:13px;color:var(--sub)}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:32px;text-align:center;color:var(--sub);border:1px dashed var(--edge);border-radius:var(--r)}
.err{background:rgba(255,107,107,.12);color:#FFB3B3;padding:12px 16px;border-radius:var(--r-s);border:1px solid rgba(255,107,107,.3)}
.note{background:rgba(245,200,107,.10);color:var(--gold);padding:12px 16px;border-radius:var(--r-s);border:1px solid rgba(245,200,107,.28);margin-bottom:16px}

/* scoreboard hero */
.board{padding:22px 22px 10px}
.board .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.board .top h2{margin:0}
.board .empty{border-color:var(--edge)}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:16px 8px;border-top:1px solid rgba(255,255,255,.07);cursor:pointer;border-radius:14px;transition:background .15s}
.mu:hover{background:rgba(255,255,255,.04)}
.mu:first-of-type{border-top:0}
.mu .side{display:flex;align-items:center;gap:12px;min-width:0}
.mu .side.r{flex-direction:row-reverse;text-align:right}
.mu img{width:46px;height:46px;border-radius:13px;background:var(--glass-2);flex:none;border:1px solid var(--edge)}
.mu .nm{font-weight:600;font-size:16px;line-height:1.15;letter-spacing:-.01em}
.mu .rec{color:var(--sub);font-size:13px}
.mu .sc{font-weight:300;font-size:46px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:74px;text-align:center;color:var(--sub)}
.mu .sc.lead{color:var(--text);font-weight:500}
.mu .vs{display:flex;flex-direction:column;align-items:center;gap:4px}
.mu .vs small{color:var(--faint);font-size:12px}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;padding:8px 10px 16px;border-top:1px dashed var(--edge)}
.lineup .pl{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05)}
.lineup .pl .pos{display:inline-block;width:38px;color:var(--faint);font-size:12px;font-weight:600}
.lineup .pl .pts{font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:640px){.mu{gap:8px}.mu img{width:36px;height:36px}.mu .sc{font-size:32px;min-width:54px}.mu .nm{font-size:14px}.lineup{grid-template-columns:1fr}}

/* trophy wall */
.shelf{margin-bottom:40px}
.shelf .year{font-weight:600;font-size:52px;letter-spacing:-.04em;line-height:1;margin:0 0 14px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.shelf .plank{height:1px;background:linear-gradient(90deg,transparent,var(--edge-2),transparent);margin-top:18px}
.trophies{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:stretch}
.trophy{text-align:center;padding:18px 12px 20px}
.trophy .ic{font-size:40px;line-height:1}
.trophy.champ{grid-column:span 2;background:linear-gradient(160deg,rgba(245,200,107,.16),rgba(255,255,255,.04));border-color:rgba(245,200,107,.35)}
.trophy.champ .ic{font-size:64px}
.trophy .lbl{font-size:13px;color:var(--sub);margin-top:10px;font-weight:500}
.trophy .who{font-weight:600;margin-top:3px;line-height:1.2}
.trophy .det{font-size:13px;color:var(--sub)}
.trophy img{width:48px;height:48px;border-radius:50%;border:2px solid var(--edge-2);margin-top:10px;background:var(--glass-2)}
.trophy.champ img{width:72px;height:72px;border-color:var(--gold)}
@media (max-width:420px){.trophy.champ{grid-column:span 1}}

/* sportsbook */
.book .line{display:grid;grid-template-columns:1fr 56px 1fr;gap:18px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.book .line .row{flex-wrap:nowrap}
.book .line .mid{text-align:center;font-size:12px;color:var(--faint);line-height:1.5}
.book .line>div:first-child{padding-left:4px}.book .line>div:last-child{padding-right:4px}
@media (max-width:640px){.book .line{grid-template-columns:1fr;gap:12px}.book .line .mid{display:none}.book .line>div:last-child{text-align:left!important}.book .line>div:last-child .row{justify-content:flex-start!important}.book .line>div:last-child .team{flex-direction:row}.bkgrid{padding-bottom:60px}}
.book .line:last-child{border-bottom:0}
.odds{font-weight:600;font-size:15px;border:1px solid var(--edge);background:var(--glass);color:var(--text);border-radius:999px;padding:7px 12px;min-width:72px;transition:background .15s,border-color .15s}
.odds:hover{background:var(--glass-2);border-color:var(--edge-2)}
.odds.sel{background:var(--blue);border-color:var(--blue);color:#061126}
.odds:disabled{opacity:.35}
.bal{font-weight:300;font-size:56px;line-height:1;letter-spacing:-.04em}
.slip{position:sticky;top:112px}
.hist td.s-won{color:var(--win);font-weight:600}.hist td.s-lost{color:var(--loss);font-weight:600}.hist td.s-push{color:var(--push)}

/* transactions */
.tx{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}
.tx:last-child{border-bottom:0}
.tx .tag{flex:none;font-weight:600;font-size:12.5px;color:var(--text);background:var(--glass-2);border:1px solid var(--edge);border-radius:999px;padding:3px 10px;height:26px;line-height:18px}
.tx .tag.trade{background:rgba(245,200,107,.14);color:var(--gold);border-color:rgba(245,200,107,.35)}
.tx .add{color:var(--win)}.tx .drop{color:var(--loss)}

/* draft */
.dgrid{display:grid;gap:6px;font-size:13px;overflow-x:auto;padding-bottom:6px}
.dcell{border-radius:var(--r-s);padding:8px 10px;min-width:126px;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.dcell b{display:block;font-weight:600;line-height:1.15}
.dcell .pos{color:var(--sub);font-size:12px}
.dcell.QB{border-left:3px solid #FF7EB6}.dcell.RB{border-left:3px solid #4CD98A}.dcell.WR{border-left:3px solid var(--blue)}.dcell.TE{border-left:3px solid #FFB35C}.dcell.K{border-left:3px solid #9AA3B2}.dcell.DEF{border-left:3px solid #C39A7A}
.dhead{font-weight:500;color:var(--sub);text-align:center;font-size:12.5px}
.dteam{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;color:var(--text);font-weight:600;font-size:12px}
.dteam img{width:34px;height:34px;border-radius:10px;border:1px solid var(--edge);background:var(--glass-2)}
.dteam .slotno{color:var(--faint);font-weight:500;font-size:11px}
.dteam .ellip{max-width:100%}
.dcell .pk{display:block;font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums;margin-bottom:2px}
.dcell .via{display:block;font-size:11px;color:var(--gold);margin-top:3px}

/* setup */
.setup{max-width:560px;margin:60px auto;padding:28px}
.setup label{display:block;font-weight:500;margin:16px 0 6px;color:var(--sub)}
.setup input{flex:1;min-width:0}
.acct{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:5px 6px 5px 14px;font-size:14px}
.acct img{width:30px;height:30px;border-radius:50%;border:1px solid var(--edge)}
.acct button{background:transparent;border:0;color:var(--sub);font-size:13px;padding:6px 10px;border-radius:999px}
.acct button:hover{color:var(--text);background:var(--glass-2)}
.mu.mine{background:rgba(90,169,255,.07);box-shadow:inset 3px 0 0 var(--blue)}
tr.mine td{background:rgba(90,169,255,.07)}
.auth{max-width:420px;margin:70px auto;padding:30px}
.auth h2{font-size:28px;margin-bottom:4px}
.auth .tabs{display:flex;gap:2px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:3px;margin:18px 0}
.auth .tabs button{flex:1;border:0;background:transparent;color:var(--sub);border-radius:999px;padding:8px;font-weight:500;font-size:14px}
.auth .tabs button.on{background:var(--glass-2);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.auth input,.auth select{width:100%;margin-top:10px;padding:12px 14px;font-size:16px}
.auth .btn{width:100%;margin-top:16px;padding:12px}
.auth .link{background:none;border:0;color:var(--blue);font-size:14px;padding:0;margin-top:14px}
.auth .msg{margin-top:12px;font-size:14px;min-height:20px}
.trophy .del{position:absolute;top:8px;right:8px;background:var(--glass-2);border:1px solid var(--edge);color:var(--sub);border-radius:999px;width:24px;height:24px;font-size:13px;line-height:1;padding:0}
.trophy{position:relative}
.addt{margin:6px 0 30px}
.addt .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.addt input,.addt select{width:100%}
.rb{overflow-x:auto}
.rb table{min-width:860px}
.rb td.name{font-weight:600}
.rb .ten{color:var(--sub);font-size:13px}
.calls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.call .big{font-weight:300;font-size:40px;letter-spacing:-.03em;line-height:1}
.call .lbl{color:var(--sub);font-size:13px;margin-top:4px}
.call .who{font-weight:600;margin-top:8px}

/* gamecast */
.gotw{margin-bottom:18px;padding:22px;position:relative;overflow:hidden}
.gotw .tag{position:absolute;top:14px;left:22px;font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.02em}
.gotw .mu{padding-top:22px}
.gotw .mu .sc{font-size:64px}
.gotw .mu img{width:60px;height:60px;border-radius:16px}
.gotw .mu .nm{font-size:19px}
.mu{position:relative}
.mu .live{display:inline-flex;align-items:center;gap:5px;color:var(--win)}
.mu .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 0 0 rgba(76,217,138,.6);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{to{box-shadow:0 0 0 8px rgba(76,217,138,0)}}
.gc{padding:0 8px 14px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:2px}
.gc .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;display:flex}
.gc .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#8FC3FF);transition:width .6s ease}
.gc .bar span+span{background:linear-gradient(90deg,#FFB35C,#FF8A5C)}
.gc .pcts{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:5px;font-variant-numeric:tabular-nums}
.gc .tops{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--sub);margin-top:6px}
.gc .tops b{color:var(--text);font-weight:600}
.gc .tops div:last-child{text-align:right}
@media (max-width:640px){.gotw .mu .sc{font-size:40px}.gotw .mu img{width:44px;height:44px}.gotw .mu .nm{font-size:15px}}

/* skeleton */
.skel{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.skel i{display:block;height:46px;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.05) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.skel i.sm{height:22px;width:60%}
@keyframes shimmer{to{background-position:-200% 0}}

/* tab crossfade */
main section{animation:tabin .22s ease-out}
@keyframes tabin{from{opacity:0;transform:translateY(4px)}}

/* head-to-head modal */
.overlay{position:fixed;inset:0;background:rgba(4,6,12,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:tabin .2s ease-out}
.h2h{width:100%;max-width:860px;padding:22px;background:rgba(14,18,30,.88)}
.h2h .x{position:absolute;top:14px;right:14px;background:var(--glass-2);border:1px solid var(--edge);color:var(--text);border-radius:999px;width:32px;height:32px;font-size:16px;padding:0}
.h2h{position:relative}
.h2h .mu{cursor:default}
.h2h .mu:hover{background:transparent}
.h2h .alltime{text-align:center;margin:10px 0 18px}
.h2h .alltime .big{font-weight:300;font-size:34px;letter-spacing:-.03em}
.h2h .alltime .lbl{color:var(--sub);font-size:13px}
.h2h .meet{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.h2h .meet .w{color:var(--win)}
.sbs{display:grid;grid-template-columns:1fr auto 1fr;gap:0 10px;margin-top:10px}
.sbs .slot{display:contents}
.sbs .p{display:flex;justify-content:space-between;gap:8px;padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;border-radius:8px}
.sbs .p.hi{background:rgba(255,255,255,.05)}
.sbs .p .pt{font-weight:600;font-variant-numeric:tabular-nums}
.sbs .p.r{flex-direction:row-reverse;text-align:right}
.sbs .pos{align-self:center;color:var(--faint);font-size:12px;font-weight:600;width:36px;text-align:center}
@media (max-width:560px){.sbs .p{font-size:13px;padding:6px}}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.srow:last-child{border-bottom:0}
.srow .odds{min-width:0;padding:6px 10px;font-size:14px}
.botw{margin-bottom:14px;background:linear-gradient(160deg,rgba(245,200,107,.14),rgba(255,255,255,.04));border-color:rgba(245,200,107,.35)}
.botw .lbl{font-size:12px;color:var(--gold);font-weight:600}
.botw .who{margin-top:4px}
.botw .big{font-weight:300;font-size:36px;letter-spacing:-.03em;color:var(--win)}
.badges span{font-size:16px;margin-right:4px;cursor:help}
.fit1{font-size:.9em}.fit2{font-size:.8em;letter-spacing:-.01em}.fit3{font-size:.7em;letter-spacing:-.015em}

/* sportsbook layout */
.bkhead{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;padding:18px 22px;margin-bottom:14px}
.bkhead .stat .v{font-weight:300;font-size:34px;letter-spacing:-.03em;line-height:1}
.bkhead .stat .v.small{font-size:16px;font-weight:600;padding-top:8px}
.bkhead .stat .l{color:var(--sub);font-size:12.5px;margin-top:4px}
.bkhead .botw2{margin-left:auto;font-size:13px;padding:10px 14px;border-radius:14px;background:rgba(245,200,107,.12);border:1px solid rgba(245,200,107,.3)}
.bkhead .botw2 .lbl{color:var(--gold);font-weight:600;font-size:12px;margin-bottom:2px}
.seg{display:flex;gap:2px;background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:3px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;color:var(--sub);border-radius:999px;padding:9px 12px;font-weight:500;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--glass-2);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.bkgrid{grid-template-columns:1.6fr 1fr}
.slipwrap{position:sticky;top:112px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{background:var(--glass);border:1px solid var(--edge);color:var(--sub);border-radius:999px;padding:5px 11px;font-size:13px}
.chips button.on{background:var(--glass-2);color:var(--text);border-color:var(--edge-2)}
.chip{background:var(--glass);border:1px solid var(--edge);color:var(--text);border-radius:999px;padding:5px 12px;font-size:13px}
.chip:hover{background:var(--glass-2)}
.lb .badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.lb .bdg{font-size:11.5px;color:var(--sub);background:var(--glass);border:1px solid var(--edge);border-radius:999px;padding:1px 8px}
.slipcard .x{width:28px;height:28px;border-radius:999px;border:1px solid var(--edge);background:var(--glass-2);color:var(--text);font-size:15px;padding:0}
.mob{display:none}
@media (max-width:760px){
  .bkgrid{grid-template-columns:1fr}
  .bkhead .botw2{margin-left:0;width:100%}
  .slipwrap{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;padding:10px 12px calc(12px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s ease}
  .slipwrap.open{transform:none}
  .slipwrap .card{background:rgba(14,18,30,.92);box-shadow:0 -20px 50px rgba(0,0,0,.5)}
  .mob{display:inline-block}
  .bkhead .stat .v{font-size:26px}
}
.luck{display:flex;align-items:center;gap:8px}
.luck .neg,.luck .pos{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.luck .neg span{position:absolute;right:0;top:0;height:100%;background:var(--loss);border-radius:999px}
.luck .pos span{position:absolute;left:0;top:0;height:100%;background:var(--win);border-radius:999px}
.luck b{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.rk{display:inline-block;min-width:22px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.bracket{display:grid;gap:14px;align-items:stretch}
.brnd{display:flex;flex-direction:column}
.brh{font-size:12.5px;color:var(--sub);font-weight:500;text-align:center;margin-bottom:8px}
.bgames{display:flex;flex-direction:column;justify-content:space-around;gap:14px;flex:1}
.bg{position:relative;background:var(--glass);border:1px solid var(--edge);border-radius:12px;overflow:hidden}
.bt{display:flex;align-items:center;gap:8px;padding:9px 10px;font-size:14px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.06)}
.bt:last-of-type{border-bottom:0}
.bt img{width:26px;height:26px;border-radius:7px;border:1px solid var(--edge);background:var(--glass-2);flex:none}
.bt .seed{width:16px;font-size:11px;color:var(--faint);text-align:right;flex:none;font-variant-numeric:tabular-nums}
.bt.won{background:rgba(76,217,138,.10)}
.bt.lost{opacity:.5}
.bt .chk{margin-left:auto;color:var(--win);font-weight:700}
.bt.tbd{color:var(--faint)}
.bglbl{position:absolute;top:-1px;right:8px;font-size:10.5px;color:var(--gold);font-weight:600}
.h2hpick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:16px}
.h2hpick select{width:100%;font-size:16px;padding:11px 12px}
.h2hpick .btn{padding:9px 14px}
.series .srow-h{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.series .who{display:flex;align-items:center;gap:10px;font-size:17px;min-width:0}
.series .who.r{justify-content:flex-end;text-align:right}
.series .who img{width:44px;height:44px;border-radius:12px;border:1px solid var(--edge);background:var(--glass-2);flex:none}
.series .mid{text-align:center}
.series .big{font-weight:300;font-size:52px;letter-spacing:-.04em;line-height:1}
.series .lbl{color:var(--sub);font-size:13px;margin-top:4px}
.series .meet{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.series .meet .w{color:var(--win);font-weight:600}
.cmp td.lbl{text-align:center;color:var(--sub);font-size:13px;width:44%}
.cmp td.num{text-align:right;font-size:17px;font-weight:600}
.cmp td.num.l,.cmp th.l{text-align:left}
.cmp td.edge{color:var(--win)}
.cmp td.edge::after{content:" ◀";font-size:10px;color:var(--win)}
.cmp td.edge.l::after{content:""}
.cmp td.edge.l::before{content:"▶ ";font-size:10px;color:var(--win)}
@media (max-width:560px){.series .big{font-size:40px}.series .who{font-size:14px}.series .who img{width:32px;height:32px}}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--text)}
th.sortable.on{color:var(--text)}
th .arr{font-size:9px;margin-left:4px;color:var(--blue)}
footer{text-align:center;color:var(--faint);font-size:13px;padding:24px 0}
@media (prefers-reduced-motion:no-preference){.lineup{animation:open .18s ease-out}@keyframes open{from{opacity:0;transform:translateY(-4px)}}}
</style>

<body>

<header><div class="wrap">
  <div class="hbar">
    <img class="avatar" id="lgAvatar" alt="">
    <div style="flex:1;min-width:0"><h1 id="lgName">League Clubhouse</h1><div class="sub" id="lgSub">Connecting to Sleeper…</div></div>
    <div id="acct"></div>
  </div>
  <nav id="nav">
    <button data-t="score" class="on">Scoreboard</button>
    <button data-t="stand">Standings</button>
    <button data-t="trophy">Trophy wall</button>
    <button data-t="book">Sportsbook</button>
    <button data-t="tx">Transactions</button>
    <button data-t="draft">Draft</button>
    <button data-t="records">Record book</button>
  </nav>
</div></header>

<main><div class="wrap">
  <div id="alert"></div>
  <section id="t-setup" hidden></section>
  <section id="t-score"></section>
  <section id="t-stand" hidden></section>
  <section id="t-trophy" hidden></section>
  <section id="t-book" hidden></section>
  <section id="t-tx" hidden></section>
  <section id="t-draft" hidden></section>
  <section id="t-records" hidden></section>
</div></main>
<footer>Data from Sleeper. Sportsbook currency is play money. <span class="muted" id="ver"></span></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ================= CONFIG =================
   1. Put your Sleeper league ID here (see README for how to find it).
   2. Supabase URL + anon key: enables member login (site is locked to league
      members) and the shared sportsbook. Without them the site is open and bets
      are stored only in this browser.
*/
const VERSION = "v15";
const CONFIG = {
  LEAGUE_ID: "1389695305292734464",
  SUPABASE_URL: "https://cqstbjpllmcgvotrloid.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_ghn1Hmo3e2BIN_aJOaUMJA_hgfU_lPh",
  STARTING_BANKROLL: 1000,
  WEEKLY_STIPEND: 100
};
/* =========================================== */

const API = "https://api.sleeper.app/v1";
const CDN = "https://sleepercdn.com";
const $ = (s, r=document) => r.querySelector(s);
const el = (h) => { const t=document.createElement("template"); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round((n||0)*100)/100).toFixed(2);
const fit = name => { const n=(name||"").length; return n>30?"fit3":n>22?"fit2":n>16?"fit1":""; };
const skel = (n=4,sm=false) => `<div class="skel">${Array.from({length:n},()=>`<i class="${sm?"sm":""}"></i>`).join("")}</div>`;
const avatarUrl = (id, thumb=true) => id ? `${CDN}/avatars/${thumb?"thumbs/":""}${id}` : "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1' height='1'/>";

const S = { leagueId: null, league:null, users:{}, rosters:[], state:null, players:{}, matchups:{}, teams:{}, week:1, me:null, bets:[], bettors:[] };

async function j(url){ const r = await fetch(url); if(!r.ok) throw new Error(`${r.status} from ${url}`); return r.json(); }
const cache = {
  get(k){ try{ const v=JSON.parse(localStorage.getItem(k)); return v; }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
};

/* ---------- players (slimmed + cached daily) ---------- */
async function loadPlayers(){
  const c = cache.get("ffl_players_v1");
  if (c && Date.now()-c.ts < 86400e3){ S.players=c.p; return; }
  try{
    const raw = await j(`${API}/players/nfl`);
    const p = {};
    for (const [id,v] of Object.entries(raw)){
      if (!v.position) continue;
      p[id] = [ (v.position==="DEF" ? `${v.first_name} ${v.last_name}` : `${v.first_name?.[0]||""}. ${v.last_name||""}`).trim(), v.position, v.team||"FA" ];
    }
    S.players = p; cache.set("ffl_players_v1",{ts:Date.now(),p});
  }catch(e){ S.players = c?.p || {}; }
}
const P = id => S.players[id] || [id, "", ""];
const pname = id => P(id)[0];

/* ---------- league core ---------- */
async function loadLeague(){
  const [league, users, rosters, state] = await Promise.all([
    j(`${API}/league/${S.leagueId}`), j(`${API}/league/${S.leagueId}/users`),
    j(`${API}/league/${S.leagueId}/rosters`), j(`${API}/state/nfl`)
  ]);
  S.league=league; S.rosters=rosters; S.state=state;
  S.users = Object.fromEntries(users.map(u=>[u.user_id,u]));
  S.teams = {};
  for (const r of rosters){
    const u = S.users[r.owner_id] || {};
    S.teams[r.roster_id] = {
      roster: r, user: u,
      name: u.metadata?.team_name || u.display_name || `Team ${r.roster_id}`,
      owner: u.display_name || "—",
      avatar: avatarUrl(u.avatar),
      wins: r.settings?.wins||0, losses: r.settings?.losses||0, ties: r.settings?.ties||0,
      pf: (r.settings?.fpts||0) + (r.settings?.fpts_decimal||0)/100,
      pa: (r.settings?.fpts_against||0) + (r.settings?.fpts_against_decimal||0)/100
    };
  }
  const seasonIsCurrent = String(league.season) === String(state.league_season);
  const last = (league.settings?.playoff_week_start||15) + 3;
  S.week = seasonIsCurrent ? Math.min(Math.max(state.display_week||state.week||1,1), last) : last;
  S.lastWeek = last;
  $("#lgName").textContent = league.name;
  document.title = league.name;
  $("#lgAvatar").src = avatarUrl(league.avatar);
  $("#lgSub").textContent = `${league.season} season · ${league.total_rosters} teams · ${seasonIsCurrent ? "Week "+S.week : league.status}`;
}
async function getMatchups(week, leagueId=S.leagueId){
  const k = `${leagueId}:${week}`;
  if (S.matchups[k]) return S.matchups[k];
  const m = await j(`${API}/league/${leagueId}/matchups/${week}`);
  S.matchups[k]=m; return m;
}
function pairMatchups(m){
  const g = {};
  for (const x of m){ if (x.matchup_id==null) continue; (g[x.matchup_id] ||= []).push(x); }
  return Object.values(g).map(a => a.sort((p,q)=>p.roster_id-q.roster_id));
}
const rec = t => `${t.wins}-${t.losses}${t.ties?"-"+t.ties:""}`;
const games = t => t.wins+t.losses+t.ties;
const ppg = t => games(t) ? t.pf/games(t) : 0;
const teamHtml = (t, small=false) => `<div class="team"><img src="${t.avatar}" alt=""><div class="ellip"><div class="n ellip ${fit(t.name)}">${esc(t.name)}</div>${small?"":`<div class="o ellip">${esc(t.owner)}</div>`}</div></div>`;

/* ---------- nav ---------- */
const rendered = {};
$("#nav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  show(b.dataset.t);
});
function show(t){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  document.querySelectorAll("main section").forEach(s=>s.hidden = s.id!=="t-"+t);
  location.hash = t;
  if (!rendered[t]){ rendered[t]=true; ({score:renderScore, stand:renderStandings, trophy:renderTrophies, book:renderBook, tx:renderTx, draft:renderDraft, records:renderRecords})[t]?.(); }
}

/* ================= SCOREBOARD ================= */
async function renderScore(){
  const sec = $("#t-score");
  const weeks = Array.from({length:S.lastWeek},(_,i)=>i+1);
  sec.innerHTML = `<div id="gotw"></div><div class="board"><div class="top"><h2 id="sbTitle">Week ${S.week}</h2>
    <label class="muted">Week <select id="wk">${weeks.map(w=>`<option ${w===S.week?"selected":""}>${w}</option>`).join("")}</select></label></div>
    <div id="sbBody">${skel(5)}</div></div>`;
  $("#wk").onchange = e => drawWeek(+e.target.value);
  drawWeek(S.week);
}
const winProb = (a,b) => { // blend pre-game rating with live score as the game progresses
  const ta=S.teams[a.roster_id], tb=S.teams[b.roster_id]; const ra=ppg(ta)||100, rb=ppg(tb)||100;
  const pa=a.points||0, pb=b.points||0; const played = Math.min(1,(pa+pb)/Math.max(ra+rb,1));
  const exp = (pa-pb) + (ra-rb)*(1-played);           // expected final margin
  const sd = 30*Math.sqrt(Math.max(0.02,1-played));   // uncertainty shrinks as the week plays out
  return Math.min(.99,Math.max(.01, 1/(1+Math.exp(-1.7*exp/sd))));
};
const topScorer = m => { let best=null; (m.starters||[]).forEach((pid,i)=>{ const p=(m.starters_points||[])[i] ?? m.players_points?.[pid]; if(pid&&pid!=="0"&&p!=null&&(!best||p>best.p)) best={pid,p}; }); return best; };
function muHtml(a,b,week,gotw=false){
  const ta=S.teams[a.roster_id], tb=b?S.teams[b.roster_id]:null;
  const pa=a.points||0, pb=b?.points||0, started=pa>0||pb>0;
  const final = started && (week<S.week || !isCurrentSeason());
  const live = started && !final;
  const prob = b ? winProb(a,b) : .5;
  const tsA=topScorer(a), tsB=b?topScorer(b):null;
  return `<div class="mu ${S.me&&(a.roster_id===S.me.roster_id||b?.roster_id===S.me.roster_id)?"mine":""}" role="button" tabindex="0" data-mid="${a.matchup_id}">
      <div class="side">${imgNm(ta)}</div>
      <div class="vs"><div class="row" style="gap:6px;flex-wrap:nowrap"><span class="sc ${started&&pa>pb?"lead":""}" data-r="${a.roster_id}" data-v="${pa}">${fmt(pa)}</span><small>–</small><span class="sc ${started&&pb>pa?"lead":""}" data-r="${b?.roster_id||""}" data-v="${pb}">${fmt(pb)}</span></div>
        <small class="${live?"live":""}">${final?"Final":live?"Live":"Not started"}</small></div>
      <div class="side r">${tb?imgNm(tb):'<div class="nm muted">Bye</div>'}</div>
    </div>
    ${b?`<div class="gc"><div class="bar"><span style="width:${(prob*100).toFixed(1)}%"></span><span style="width:${((1-prob)*100).toFixed(1)}%"></span></div>
      <div class="pcts"><span>${Math.round(prob*100)}%</span><span>${final?"":"win probability"}</span><span>${Math.round((1-prob)*100)}%</span></div>
      ${started?`<div class="tops"><div>${tsA?`<b>${esc(pname(tsA.pid))}</b> ${fmt(tsA.p)}`:""}</div><div>${tsB?`${fmt(tsB.p)} <b>${esc(pname(tsB.pid))}</b>`:""}</div></div>`:""}</div>`:""}`;
}
let liveTimer=null;
async function drawWeek(week){
  clearInterval(liveTimer);
  $("#sbTitle").textContent = `Week ${week}` + (week >= (S.league.settings?.playoff_week_start||99) ? " · Playoffs" : "");
  const body = $("#sbBody"), gotw=$("#gotw");
  try{
    await S.playersReady;
    const m = await getMatchups(week);
    const pairs = pairMatchups(m);
    if(!pairs.length){ body.className="empty"; body.textContent="No matchups scheduled for this week."; gotw.innerHTML=""; return; }
    body.className="";
    // game of the week: closest by rating before kickoff, closest by score once played
    const full = pairs.filter(p=>p[1]);
    const anyStarted = full.some(([a,b])=>(a.points||0)>0||(b.points||0)>0);
    const margin = ([a,b]) => anyStarted ? Math.abs((a.points||0)-(b.points||0)) : Math.abs(ppg(S.teams[a.roster_id])-ppg(S.teams[b.roster_id]));
    const star = full.length>1 ? full.reduce((x,y)=>margin(y)<margin(x)?y:x) : null;
    gotw.innerHTML = star ? `<div class="card gotw"><div class="tag">${anyStarted?"Game of the week · closest game":"Game of the week · tightest matchup"}</div>${muHtml(star[0],star[1],week,true)}</div>` : "";
    body.innerHTML = pairs.filter(p=>p!==star).map(([a,b])=>muHtml(a,b,week)).join("");
    const open = e => { const mu=e.target.closest(".mu"); if(!mu) return; const pr=pairs.find(p=>p[0].matchup_id==mu.dataset.mid); if(pr&&pr[1]) openH2H(pr[0],pr[1],week); };
    body.onclick=open; gotw.onclick=open;
    const key = e => { if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("mu")){ e.preventDefault(); open(e); } };
    body.onkeydown=key; gotw.onkeydown=key;
    // live refresh every 60s while games are on
    const live = isCurrentSeason() && week===S.week && (!anyStarted || full.some(([a,b])=>true));
    if (live) liveTimer = setInterval(()=>refreshScores(week), 60000);
  }catch(e){ body.className="err"; body.textContent = "Could not load matchups: "+e.message; }
}
async function refreshScores(week){
  if ($("#t-score").hidden) return;
  try{
    delete S.matchups[`${S.leagueId}:${week}`];
    const m = await getMatchups(week);
    const byR = Object.fromEntries(m.map(x=>[x.roster_id,x]));
    let changed=false;
    document.querySelectorAll("#t-score .sc[data-r]").forEach(el=>{ const x=byR[el.dataset.r]; if(!x) return; const to=x.points||0, from=+el.dataset.v; if(Math.abs(to-from)>0.004){ changed=true; roll(el,from,to); el.dataset.v=to; } });
    if (changed) setTimeout(()=>drawWeek(week), 1200); // re-render for probability bars and leaders after the roll
  }catch{}
}
function roll(el, from, to){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=fmt(to); return; }
  const t0=performance.now(), dur=900;
  const step = now => { const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=fmt(from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const isCurrentSeason = () => String(S.league.season)===String(S.state.league_season);
const imgNm = t => `<img src="${t.avatar}" alt=""><div class="ellip"><div class="nm ellip ${fit(t.name)}">${esc(t.name)}</div><div class="rec">${esc(t.owner)} · ${rec(t)}</div></div>`;

/* ---- head-to-head ---- */
async function openH2H(a,b,week){
  const ta=S.teams[a.roster_id], tb=S.teams[b.roster_id];
  const ov = el(`<div class="overlay"><div class="card h2h"><button class="x" aria-label="Close">×</button>
    ${muHtml(a,b,week).replace(/role="button" tabindex="0"/,"")}
    <div class="alltime"><div class="big" id="h2hRec">${skel(1,true).replace('class="skel"','class="skel" style="align-items:center"')}</div><div class="lbl">all-time head to head, Sleeper era · <a href="#records" id="h2hFull" style="color:var(--blue)">Full comparison →</a></div></div>
    <div id="h2hLine"></div>
    <div id="h2hMeet" style="margin-top:18px"></div></div></div>`);
  document.body.appendChild(ov);
  const close=()=>{ ov.remove(); document.removeEventListener("keydown",esc_); }; const esc_=e=>{ if(e.key==="Escape") close(); };
  ov.onclick=e=>{ if(e.target===ov||e.target.classList.contains("x")) close(); }; document.addEventListener("keydown",esc_);
  $("#h2hFull",ov).onclick=()=>{ S.h2hA=ta.user.user_id; S.h2hB=tb.user.user_id; S.rbTab="h2h"; close(); delete rendered.records; show("records"); };
  // lineups side by side
  const pos = S.league.roster_positions.filter(p=>p!=="BN"&&p!=="IR"&&p!=="TAXI");
  const pt = (m,i) => { const pid=(m.starters||[])[i]; const p=(m.starters_points||[])[i] ?? m.players_points?.[pid]; return {pid, p: p==null?null:+p}; };
  const started=(a.points||0)>0||(b.points||0)>0;
  $("#h2hLine",ov).innerHTML = `<div class="sbs">${pos.map((ps,i)=>{ const A=pt(a,i), B=pt(b,i); const hiA=started&&A.p!=null&&B.p!=null&&A.p>B.p, hiB=started&&A.p!=null&&B.p!=null&&B.p>A.p;
    const cell=(x,cls)=>`<div class="p ${cls}"><span class="ellip">${!x.pid||x.pid==="0"?'<span class="muted">Empty</span>':esc(pname(x.pid))} <span class="muted" style="font-size:12px">${esc(P(x.pid)[2])}</span></span><span class="pt">${x.p==null?"":fmt(x.p)}</span></div>`;
    return `<div class="slot">${cell(A,hiA?"hi":"")}<div class="pos">${esc(ps)}</div>${cell(B,"r "+(hiB?"hi":""))}</div>`; }).join("")}</div>`;
  // all-time record
  try{
    const meets = await headToHead(ta.user.user_id, tb.user.user_id);
    const done = meets.filter(x=>x.final);
    const wA = done.filter(x=>x.winner===ta.user.user_id).length, wB = done.filter(x=>x.winner===tb.user.user_id).length, ties=done.length-wA-wB;
    const lead = wA>wB?`${esc(ta.owner)} leads`:wB>wA?`${esc(tb.owner)} leads`:"Series tied";
    $("#h2hRec",ov).innerHTML = done.length? `${lead} ${Math.max(wA,wB)}–${Math.min(wA,wB)}${ties?`–${ties}`:""}` : "First meeting";
    $("#h2hMeet",ov).innerHTML = done.length? `<h3>Past meetings</h3>${done.sort((x,y)=>y.season-x.season||y.week-x.week).map(x=>`<div class="meet"><span>${x.season} · Week ${x.week}${x.playoff?" · Playoffs":""}</span><span><span class="${x.winner===ta.user.user_id?"w":""}">${esc(ta.owner)} ${fmt(x.pa)}</span> – <span class="${x.winner===tb.user.user_id?"w":""}">${fmt(x.pb)} ${esc(tb.owner)}</span></span></div>`).join("")}` : "";
  }catch{ $("#h2hRec",ov).textContent="—"; }
}

async function weeklyScores(){ // roster_id -> [points per played week]
  if (S.wscores && S.wscores.week===S.week) return S.wscores;
  const regEnd=(S.league.settings?.playoff_week_start||15)-1;
  const played = Array.from({length:Math.min(Math.max(S.week-1,0),regEnd)},(_,i)=>i+1);
  const ms = await Promise.all(played.map(w=>getMatchups(w).catch(()=>[])));
  const by={}; const weeks=[];
  ms.forEach((m,i)=>{ const wk={}; for (const x of m){ if(!S.teams[x.roster_id]) continue; (by[x.roster_id] ||= []).push(x.points||0); wk[x.roster_id]=x.points||0; } weeks.push({week:played[i], pts:wk}); });
  return S.wscores={week:S.week, by, weeks};
}
function allPlay(ws){
  const out={};
  for (const t of Object.values(S.teams)){ out[t.roster.roster_id]={w:0,l:0,t:0,ranks:[]}; }
  for (const wk of ws.weeks){
    const ids=Object.keys(wk.pts).map(Number); if(ids.length<2) continue;
    const sorted=[...ids].sort((x,y)=>wk.pts[y]-wk.pts[x]);
    for (const rid of ids){ const o=out[rid]; if(!o) continue; for (const other of ids){ if(other===rid) continue; if(wk.pts[rid]>wk.pts[other]) o.w++; else if(wk.pts[rid]<wk.pts[other]) o.l++; else o.t++; } o.ranks.push(sorted.indexOf(rid)+1); }
  }
  for (const o of Object.values(out)){ const g=o.w+o.l+o.t; o.pct=g?(o.w+.5*o.t)/g:0; }
  return out;
}

      ${power.map((p,i)=>`<tr class="${S.me?.roster_id===p.t.roster.roster_id?"mine":""}"><td class="muted">${i+1}</td><td>${teamHtml(p.t,true)}</td><td class="num">${p.score.toFixed(1)}</td><td class="num">${rec(p.t)}</td><td class="num">${fmt(ppg(p.t))}</td><td class="num">${fmt(p.rAvg)}</td></tr>`).join("")}

    const akeys = { ap:(a,b)=>b.ap.pct-a.ap.pct||b.t.pf-a.t.pf, team:(a,b)=>a.t.name.localeCompare(b.t.name), actual:(a,b)=>(b.t.wins-a.t.wins)||(a.t.losses-b.t.losses), exp:(a,b)=>b.exp-a.exp, luck:(a,b)=>b.luck-a.luck };

        ${rows.map(r=>`<tr class="${S.me?.roster_id===r.t.roster.roster_id?"mine":""}"><td>${teamHtml(r.t,true)}</td>${r.ap.ranks.map(k=>`<td style="text-align:center"><span class="rk" style="color:${rankColor(k)}">${k}</span></td>`).join("")}${Array(Math.max(0,S.ws.weeks.length-r.ap.ranks.length)).fill('<td></td>').join("")}<td class="num">${r.ap.ranks.length?(r.ap.ranks.reduce((x,y)=>x+y,0)/r.ap.ranks.length).toFixed(1):"·"}</td></tr>`).join("")}

    $("#apTable thead").onclick = e => { const h=e.target.closest("th.sortable"); if(!h) return; const k=h.dataset.k; S.apSort = (aso.k===k) ? {k, d:-aso.d} : {k, d:1}; drawStSec(); };

async function drawBracket(){

    box.innerHTML = `<div class="card"><div class="row spread" style="margin-bottom:12px"><h3 style="margin:0">Playoff bracket</h3>${projected?`<span class="pill">Projected · if the season ended today</span>`:`<span class="pill brass">Week ${pstart}+</span>`}</div>
      <div class="rb"><div class="bracket" style="grid-template-columns:repeat(${rks.length},minmax(210px,1fr))">
        ${rks.map(r=>`<div class="brnd"><div class="brh">${r===rks[rks.length-1]?"Final":r===rks[rks.length-2]?"Semifinals":"Round "+r}</div><div class="bgames">${rounds[r].sort((x,y)=>x.m-y.m).map(game).join("")}</div></div>`).join("")}

  }catch{}
}

async function seasonAwards(lg){
  const complete = lg.status==="complete";
  const ck = `ffl_awards_${lg.league_id}`; const c = cache.get(ck); if (c && complete) return c;
  const isThis = lg.league_id===S.leagueId;
  let teams = S.teams;
  if(!isThis){
    const [users, rosters] = await Promise.all([j(`${API}/league/${lg.league_id}/users`), j(`${API}/league/${lg.league_id}/rosters`)]);
    const um = Object.fromEntries(users.map(u=>[u.user_id,u])); teams={};
    for (const r of rosters){ const u=um[r.owner_id]||{}; teams[r.roster_id]={name:u.metadata?.team_name||u.display_name||`Team ${r.roster_id}`, owner:u.display_name||"—", avatar:avatarUrl(u.avatar), wins:r.settings?.wins||0, losses:r.settings?.losses||0, ties:r.settings?.ties||0, pf:(r.settings?.fpts||0)+(r.settings?.fpts_decimal||0)/100, pa:(r.settings?.fpts_against||0)+(r.settings?.fpts_against_decimal||0)/100}; }
  }
  const T = Object.values(teams).map((t,i)=>({...t, rid: Object.keys(teams)[i]}));
  const out = [];
  const trophy = (ic, lbl, t, det, champ=false) => t ? `<div class="trophy ${champ?"champ":""}"><div class="ic">${ic}</div><div class="lbl">${lbl}</div><img src="${t.avatar}" alt=""><div class="who">${esc(t.name)}</div><div class="det">${esc(t.owner)}${det?" · "+esc(det):""}</div></div>` : "";
  // bracket results
  let champ=null, runner=null, third=null;
  try{ const wb = await j(`${API}/league/${lg.league_id}/winners_bracket`); const f = wb.find(g=>g.p===1); if(f?.w){ champ=teams[f.w]; runner=teams[f.l]; } const t3=wb.find(g=>g.p===3); if(t3?.w) third=teams[t3.w]; }catch{}
  if (champ) out.push(trophy("🏆","Champion",champ,rec(champ),true));
  if (runner) out.push(trophy("🥈","Runner-up",runner,rec(runner)));
  if (third) out.push(trophy("🥉","Third place",third,rec(third)));
  // regular season
  const bestRec = [...T].sort((a,b)=>b.wins-a.wins||a.losses-b.losses||b.pf-a.pf)[0];
  const topPf = [...T].sort((a,b)=>b.pf-a.pf)[0];
  const sacko = [...T].sort((a,b)=>a.wins-b.wins||b.losses-a.losses||a.pf-b.pf)[0];
  const unlucky = [...T].sort((a,b)=>b.pa-a.pa)[0];
  if (bestRec && (complete || bestRec.wins>0)) out.push(trophy("📋","Best record",bestRec,rec(bestRec)));
  if (topPf && topPf.pf>0) out.push(trophy("🔥","Most points",topPf,fmt(topPf.pf)+" pts"));
  if (unlucky && unlucky.pa>0) out.push(trophy("🛡️","Most points against",unlucky,fmt(unlucky.pa)+" pts"));
  if (sacko && (complete || games(sacko)>2)) out.push(trophy("🚽","The Sacko",sacko,rec(sacko)));
  // single-week records
  try{
    const lastReg = (lg.settings?.playoff_week_start||15)-1;
    const maxW = isThis ? Math.min(lastReg, Math.max(S.week-1,0)) : lastReg;
    const wk = Array.from({length:maxW},(_,i)=>i+1);
    const ms = await Promise.all(wk.map(w=>getMatchups(w, lg.league_id)));
    let hi=null, lo=null, blow=null;
    ms.forEach((m,i)=>{ for(const x of m){ if(!x.points) continue; if(!hi||x.points>hi.p) hi={p:x.points,t:teams[x.roster_id],w:wk[i]}; if(!lo||x.points<lo.p) lo={p:x.points,t:teams[x.roster_id],w:wk[i]}; }
      for (const [a,b] of pairMatchups(m)){ if(!b) continue; const d=Math.abs((a.points||0)-(b.points||0)); if(!blow||d>blow.d) blow={d, t:teams[(a.points||0)>(b.points||0)?a.roster_id:b.roster_id], w:wk[i]}; } });
    if (hi) out.push(trophy("💥","Highest single week",hi.t,`${fmt(hi.p)} pts, week ${hi.w}`));
    if (lo) out.push(trophy("🪦","Lowest single week",lo.t,`${fmt(lo.p)} pts, week ${lo.w}`));
    if (blow) out.push(trophy("🥊","Biggest blowout",blow.t,`by ${fmt(blow.d)}, week ${blow.w}`));
  }catch{}
  const html = out.length ? out.join("") : `<div class="empty" style="grid-column:1/-1">Nothing to show yet. Trophies appear once games are played.</div>`;
  if (complete) cache.set(ck, html);
  return html;
}

    if(!r.ok) throw new Error(`Database error (${r.status})`);
    const t = await r.text(); return t ? JSON.parse(t) : [];
  },
  // localStorage fallback (single browser)
  local(table, qs, opts){

    if (opts.method==="POST"){ const add=[].concat(opts.body).map(b=>({id:crypto.randomUUID(),...b})); rows.push(...add); cache.set(k,rows); return add; }

async function sha(s){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }


/* ---- lines ---- */
function lines(pairs){
  return pairs.filter(([a,b])=>b).map(([a,b])=>{
    const ta=S.teams[a.roster_id], tb=S.teams[b.roster_id];
    const ra=ppg(ta)||100, rb=ppg(tb)||100;
    let p = 1/(1+Math.exp(-(ra-rb)/12)); p=Math.min(.85,Math.max(.15,p));
    const vig=.95;
    return { mid:a.matchup_id, a:ta, b:tb, ra:a.roster_id, rb:b.roster_id, oddsA:+(vig/p).toFixed(2), oddsB:+(vig/(1-p)).toFixed(2), total:+((ra+rb)).toFixed(1), oddsOU:1.9, started:(a.points||0)>0||(b.points||0)>0 };
  });
}
function specialLines(m){ // top / bottom scorer of the week
  const rs = m.map(x=>x.roster_id).filter(r=>S.teams[r]);
  const r = Object.fromEntries(rs.map(rid=>[rid, ppg(S.teams[rid])||100]));
  const soft = (sign) => { const e = Object.fromEntries(rs.map(rid=>[rid, Math.exp(sign*r[rid]/15)])); const z=Object.values(e).reduce((x,y)=>x+y,0); return Object.fromEntries(rs.map(rid=>[rid, Math.min(15, Math.max(1.2, +(0.9/(e[rid]/z)).toFixed(2)))])); };
  return { top: soft(1), bottom: soft(-1) };
}
async function playerAverages(){
  if (S.pavg && S.pavg.week===S.week) return S.pavg.map;
  const wk = Array.from({length:Math.max(S.week-1,0)},(_,i)=>i+1);
  const ms = await Promise.all(wk.map(w=>getMatchups(w).catch(()=>[])));
  const sum={}, n={};
  for (const m of ms) for (const x of m) for (const [pid,p] of Object.entries(x.players_points||{})){ sum[pid]=(sum[pid]||0)+(p||0); n[pid]=(n[pid]||0)+1; }
  const map={}; for (const pid in sum) map[pid]={avg:sum[pid]/n[pid], n:n[pid]};
  S.pavg={week:S.week, map}; return map;
}
const propLine = avg => Math.max(0.5, Math.round(avg*2)/2 + 0.5); // x.5 so no pushes

function balanceOf(rid){
  const cur = isCurrentSeason() ? S.week : S.lastWeek;
  let bal = CONFIG.STARTING_BANKROLL + CONFIG.WEEKLY_STIPEND*Math.max(cur-1,0);
  for (const b of S.bets){ if (b.roster_id!==rid) continue; if (b.status==="open") bal -= b.stake; else if (b.status==="won") bal += b.payout - b.stake; else if (b.status==="lost") bal -= b.stake; }
  return bal;
}
function bettorStats(rid){
  const mine = S.bets.filter(b=>b.roster_id===rid && b.status!=="open").sort((x,y)=>new Date(x.created_at)-new Date(y.created_at));
  let cur=0, curKind=null, longestW=0, run=0, staked=0, ret=0, biggest=null, biggestStake=0;
  for (const b of mine){
    if (b.status==="push") continue;
    staked+=b.stake; if (b.status==="won") ret+=b.payout;
    if (b.status==="won"){ run++; longestW=Math.max(longestW,run); } else run=0;
    if (curKind===b.status) cur++; else { curKind=b.status; cur=1; }
    if (b.status==="won" && (!biggest || b.payout-b.stake > biggest.payout-biggest.stake)) biggest=b;
    biggestStake=Math.max(biggestStake,b.stake);
  }
  return { n:mine.length, w:mine.filter(b=>b.status==="won").length, l:mine.filter(b=>b.status==="lost").length, streak: curKind?`${curKind==="won"?"W":"L"}${cur}`:"—", streakKind:curKind, streakLen:cur, longestW, roi: staked? (ret-staked)/staked : 0, biggest, biggestStake };
}
function badgesFor(rid, all){
  const st=all[rid], out=[];
  if (st.streakKind==="won" && st.streakLen>=3) out.push(["🔥","Hot hand · "+st.streak]);
  if (st.streakKind==="lost" && st.streakLen>=3) out.push(["🧊","Ice cold · "+st.streak]);
  const q = Object.values(all).filter(x=>x.n>=5);
  if (q.length && st.n>=5 && st.roi===Math.max(...q.map(x=>x.roi)) && st.roi>0) out.push(["🎯","Sharp · best ROI"]);
  if (st.n>0 && st.n===Math.max(...Object.values(all).map(x=>x.n)) && st.n>=5) out.push(["🎰","Degenerate · most bets"]);
  const bigs = Object.values(all).filter(x=>x.biggest); if (st.biggest && bigs.length && (st.biggest.payout-st.biggest.stake)===Math.max(...bigs.map(x=>x.biggest.payout-x.biggest.stake))) out.push(["💰","Jackpot · biggest payout"]);
  if (st.biggestStake>0 && st.biggestStake===Math.max(...Object.values(all).map(x=>x.biggestStake)) && st.biggestStake>=200) out.push(["🃏","High roller · biggest stake"]);
  if (st.longestW>=5) out.push(["👑","Heater · "+st.longestW+" straight"]);
  return out;
}

function nextKickoff(){ // estimated: Thursday night game, 8:15 PM ET = 01:15 UTC Friday
  const d=new Date(); const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),1,15));
  while (t.getUTCDay()!==5 || t<=d) t.setUTCDate(t.getUTCDate()+1);
  return t;
}

}

  const out=$("#out"); if(out) out.onclick = ()=>{ S.me=null; localStorage.removeItem(`ffl_me_${S.leagueId}`); drawSlip(); };

async function placeBet(){
  const pk=S.pick, stake=Math.floor(+$("#stake").value), msg=$("#betMsg"), bal=balanceOf(S.me.roster_id);
  if(!(stake>=1)||stake>bal){ msg.textContent=`Stake must be between 1 and ${Math.floor(bal)}.`; return; }
  const m = await getMatchups(S.week); if (lines(pairMatchups(m)).some(l=>l.started)){ msg.textContent="Lines are locked; games have started."; return; }
  const bet = { league_id:S.leagueId, roster_id:S.me.roster_id, week:S.week, matchup_id: pk.mid ?? 0, kind:pk.k, side: pk.side!=null? +pk.side : null, total: pk.total!=null? +pk.total : null, player_id: pk.pid||null, odds:+pk.odds, stake, payout:+(stake*+pk.odds).toFixed(2), status:"open", label:pk.label, created_at:new Date().toISOString() };
  $("#place").disabled=true;
  try{ const r = await DB.q("bets","",{method:"POST", body:bet, headers:{"Prefer":"return=representation"}}); S.bets.unshift(r[0]||bet); S.pick=null; drawBook(); }
  catch(e){ msg.textContent=e.message; $("#place").disabled=false; }
}
async function settleBets(){
  const open = S.bets.filter(b=>b.status==="open");
  if(!open.length) return;
  const cur = isCurrentSeason() ? S.state.week : S.lastWeek+1; // state.week rolls on Tuesday
  const done = open.filter(b=> b.week < cur);
  const byWeek = {}; for (const b of done) (byWeek[b.week] ||= []).push(b);
  for (const [w, bs] of Object.entries(byWeek)){
    let m; try{ m = await getMatchups(+w); }catch{ continue; }
    const pts = Object.fromEntries(m.map(x=>[x.roster_id, x.points||0]));
    const allPts = Object.values(pts); const hi=Math.max(...allPts), lo=Math.min(...allPts);
    for (const b of bs){
      let status;
      if (b.kind==="ml"||b.kind==="over"||b.kind==="under"){
        const g = m.filter(x=>x.matchup_id===b.matchup_id); if (g.length<2) continue;
        const tot = g.reduce((s,x)=>s+(x.points||0),0);
        if (b.kind==="ml"){ const mine=g.find(x=>x.roster_id===b.side), other=g.find(x=>x.roster_id!==b.side); status = mine.points>other.points?"won":mine.points<other.points?"lost":"push"; }
        else status = tot===+b.total?"push":(tot>+b.total)===(b.kind==="over")?"won":"lost";
      } else if (b.kind==="top"){ status = pts[b.side]===hi ? "won" : "lost"; }
      else if (b.kind==="bottom"){ status = pts[b.side]===lo ? "won" : "lost"; }
      else if (b.kind==="prop_over"||b.kind==="prop_under"){
        let p=null; for (const x of m){ if (x.players_points && b.player_id in x.players_points){ p=x.players_points[b.player_id]; break; } }
        status = p==null ? "push" : p===+b.total ? "push" : (p>+b.total)===(b.kind==="prop_over") ? "won" : "lost";
      } else continue;
      try{ await DB.q("bets", `id=eq.${b.id}&status=eq.open`, {method:"PATCH", body:{status, settled_at:new Date().toISOString()}}); b.status=status; }catch{}
    }
  }
}

async function leagueChain(){
  if (S.chain) return S.chain;
  const chain=[S.league]; let prev=S.league.previous_league_id, g=0;
  while(prev && g++<25){ try{ const l=await j(`${API}/league/${prev}`); chain.push(l); prev=l.previous_league_id; }catch{ break; } }
  return S.chain=chain;
}

async function drawDraft(lg){
  const body=$("#drBody"); body.className=""; body.innerHTML=skel(6);
  try{
    const drafts = await j(`${API}/league/${lg.league_id}/drafts`); const d = drafts[0];
    if(!d){ body.className="empty"; body.textContent=`No draft found for ${lg.season}.`; return; }
    const isThis = lg.league_id===S.leagueId;
    let teams=S.teams;
    if(!isThis){ const [users,rosters]=await Promise.all([j(`${API}/league/${lg.league_id}/users`), j(`${API}/league/${lg.league_id}/rosters`)]); const um=Object.fromEntries(users.map(u=>[u.user_id,u])); teams={};
      for(const r of rosters){ const u=um[r.owner_id]||{}; teams[r.roster_id]={name:u.metadata?.team_name||u.display_name||`Team ${r.roster_id}`, owner:u.display_name||"—", avatar:avatarUrl(u.avatar), user:u}; } }
    const picks = await j(`${API}/draft/${d.draft_id}/picks`);
    const teamsN=d.settings.teams, rounds=d.settings.rounds;
    // slot -> team: from Sleeper's map, else from round-1 picks (older drafts sometimes lack the map)
    const slotTeam = {...(d.slot_to_roster_id||{})};
    for (const p of picks){ if (p.round===1 && !slotTeam[p.draft_slot]) slotTeam[p.draft_slot] = p.roster_id ?? Object.values(teams).find(t=>t.user?.user_id===p.picked_by)?.roster?.roster_id; }
    const pickLabel = p => `${p.round}.${String(p.draft_slot).padStart(2,"0")}`;
    const grid = Array.from({length:rounds},()=>Array(teamsN).fill(null));
    for (const p of picks){ if(grid[p.round-1]) grid[p.round-1][p.draft_slot-1]=p; }
    const pn = p => `${p.metadata?.first_name?.[0]||""}. ${p.metadata?.last_name||""}`;
    let html = `<p class="muted" style="margin-top:0">${esc(d.type)} draft · ${rounds} rounds · ${d.status==="complete"?"completed":d.status}</p>`;
    // steals and busts for finished seasons: points scored by each drafted player that year
    const seasonOver = lg.status==="complete" || (isThis && !isCurrentSeason());
    if (seasonOver && d.status==="complete"){
      const totals = await seasonPlayerPoints(lg);
      const scored = picks.filter(p=>p.player_id && totals[p.player_id]!=null).map(p=>({...p, pts: totals[p.player_id]}));
      // value = position rank by points vs position rank by draft order
      const byPos={}; for(const p of scored) (byPos[p.metadata?.position||"?"] ||= []).push(p);
      for (const arr of Object.values(byPos)){ const dr=[...arr].sort((x,y)=>x.pick_no-y.pick_no); const pr=[...arr].sort((x,y)=>y.pts-x.pts); dr.forEach((p,i)=>p.dRank=i+1); pr.forEach((p,i)=>p.pRank=i+1); for(const p of arr) p.value=p.dRank-p.pRank; }
      const steals=[...scored].sort((x,y)=>y.value-x.value||y.pts-x.pts).slice(0,5);
      const busts=[...scored].filter(p=>p.round<=5).sort((x,y)=>x.value-y.value||x.pts-y.pts).slice(0,5);
      const card = (title,arr,cls) => `<div class="card"><h3>${title}</h3>${arr.map(p=>`<div class="row spread" style="padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)"><div><b>${esc(pn(p))}</b> <span class="muted" style="font-size:13px">${esc(p.metadata?.position||"")} · ${esc(p.metadata?.position||"")}${p.dRank} taken, finished ${esc(p.metadata?.position||"")}${p.pRank}</span><div class="muted" style="font-size:13px">Round ${p.round}, pick ${p.pick_no} by ${esc(teams[p.roster_id]?.name||"?")}</div></div><div class="num ${cls}" style="font-weight:600">${fmt(p.pts)}</div></div>`).join("")}</div>`;
      html += `<div class="grid2" style="margin-bottom:18px">${card("Steals of the draft",steals,"")}${card("Biggest busts (first 5 rounds)",busts,"")}</div>`;
      var ptsOf = pid => totals[pid];
    }
    html += `<div class="dgrid" style="grid-template-columns:40px repeat(${teamsN},minmax(126px,1fr))">
      <div></div>${Array.from({length:teamsN},(_,i)=>{ const t=teams[slotTeam[i+1]]; return `<div class="dhead dteam"><span class="slotno">${i+1}</span>${t?`<img src="${t.avatar}" alt="">`:""}<span class="ellip ${fit(t?.name)}">${esc(t?.name||"Slot "+(i+1))}</span></div>`; }).join("")}
      ${grid.map((r,ri)=>`<div class="dhead" style="align-self:center">${ri+1}${d.type==="snake"?`<div class="muted" style="font-size:10px">${ri%2?"←":"→"}</div>`:""}</div>${r.map(p=>{ if(!p) return `<div class="dcell muted">—</div>`;
        const owner = p.roster_id ?? Object.values(teams).find(t=>t.user?.user_id===p.picked_by)?.roster?.roster_id; const traded = owner!=null && slotTeam[p.draft_slot]!=null && owner!==slotTeam[p.draft_slot];
        return `<div class="dcell ${esc(p.metadata?.position||"")}"><span class="pk">${pickLabel(p)}</span><b>${esc(pn(p))}</b><span class="pos">${esc(p.metadata?.position||"")} · ${esc(p.metadata?.team||"FA")}${ptsOf&&ptsOf(p.player_id)!=null?` · ${fmt(ptsOf(p.player_id))} pts`:""}</span>${traded?`<span class="via ellip">via trade · ${esc(teams[owner]?.name||"?")}</span>`:""}</div>`; }).join("")}`).join("")}</div>`;
    body.innerHTML=html;
  }catch(e){ body.className="err"; body.textContent=e.message; }
}
async function seasonPlayerPoints(lg){
  const ck=`ffl_ppts_${lg.league_id}`; const c=cache.get(ck); if(c) return c;
  const lastW=(lg.settings?.playoff_week_start||15)-1; // regular season only
  const ms = await Promise.all(Array.from({length:lastW},(_,i)=>getMatchups(i+1, lg.league_id).catch(()=>[])));
  const tot={};
  for (const m of ms) for (const x of m) for (const [pid,p] of Object.entries(x.players_points||{})) tot[pid]=(tot[pid]||0)+(p||0);
  cache.set(ck,tot); return tot;
}

async function buildCareer(){
  if (S.career && S.career.week===S.week) return S.career;
  let base=[]; if (sb){ try{ base = await DB.q("records_baseline", `league_id=eq.${S.leagueId}`); }catch{} }
  const chain = await leagueChain();
  const perUser = {}; const perSeason = {};
  const blank = ()=>({wins:0,losses:0,ties:0,pf:0,titles:0,finals:0,seconds:0,thirds:0,papps:0,pw:0,pl:0,seasons:0,first:null,last:null,name:"",best:null});
  for (const lg of chain){
    const st = await sleeperSeasonStats(lg); perSeason[lg.season]=st;
    for (const [uid,x] of Object.entries(st)){ const u = perUser[uid] ||= blank();
      for (const k of ["wins","losses","ties","pf","titles","finals","seconds","thirds","papps","pw","pl"]) u[k]+=x[k]||0;
      u.seasons++; u.name = u.name||x.name; const y=+lg.season; u.first=u.first?Math.min(u.first,y):y; u.last=u.last?Math.max(u.last,y):y;
      const pct=(x.wins+x.losses)?x.wins/(x.wins+x.losses):0; if(!u.best||pct>u.best.pct) u.best={pct, rec:`${x.wins}-${x.losses}`, season:y}; }
  }
  const rows=[]; const used=new Set();
  for (const b of base){
    const r = {name:b.manager, uid:null, wins:b.wins||0, losses:b.losses||0, ties:b.ties||0, titles:b.titles||0, finals:b.finals||0, seconds:b.seconds||0, thirds:b.thirds||0, papps:b.playoff_apps||0, pw:b.playoff_wins||0, pl:b.playoff_losses||0, seasons:b.seasons||0, first:b.tenure_start, last:b.tenure_end, current:false, sl:null};
    if (b.sleeper_username){
      let uid=null; const ck=`ffl_uid_${b.sleeper_username.toLowerCase()}`; uid=cache.get(ck);
      if(!uid){ try{ uid=(await j(`${API}/user/${encodeURIComponent(b.sleeper_username)}`)).user_id; cache.set(ck,uid); }catch{} }
      if (uid && perUser[uid]){ const u=perUser[uid]; used.add(uid); r.uid=uid; r.sl=u;
        for (const k of ["wins","losses","ties","titles","finals","seconds","thirds","papps","pw","pl","seasons"]) r[k]+=u[k];
        r.last=Math.max(r.last||0,u.last); r.current = !!S.users[uid]; }
    }
    rows.push(r);
  }
  for (const [uid,u] of Object.entries(perUser)){ if(used.has(uid)) continue; rows.push({...u, uid, sl:u, current:!!S.users[uid]}); }
  return S.career={week:S.week, rows, perUser, perSeason, chain};
}
