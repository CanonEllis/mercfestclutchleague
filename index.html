/* ---- head to head tab ---- */
async function allMeetings(){ // every Sleeper-era matchup as {season, week, playoff, ua, ub, pa, pb, final, winner}
  const chain = await leagueChain(); const out=[];
  for (const lg of chain){
    const ck=`ffl_h2h_${lg.league_id}`; let rows=cache.get(ck);
    if(!rows || lg.status!=="complete"){
      const isThis=lg.league_id===S.leagueId;
      const rosters = isThis? S.rosters : await j(`${API}/league/${lg.league_id}/rosters`);
      const owner = Object.fromEntries(rosters.map(r=>[r.roster_id,r.owner_id]));
      const lastW = (lg.settings?.playoff_week_start||15)+3;
      const maxW = isThis && isCurrentSeason() ? S.week : lastW;
      const ms = await Promise.all(Array.from({length:maxW},(_,i)=>getMatchups(i+1, lg.league_id).catch(()=>[])));
      rows=[];
      ms.forEach((m,i)=>{ for (const [a,b] of pairMatchups(m)){ if(!b) continue; const pa=a.points||0,pb=b.points||0; const final = pa>0||pb>0 ? !(isThis&&isCurrentSeason()&&i+1>=S.week) : false;
        rows.push({season:+lg.season, week:i+1, playoff:i+1>=(lg.settings?.playoff_week_start||99), ua:owner[a.roster_id], ub:owner[b.roster_id], pa, pb, final, winner: pa>pb?owner[a.roster_id]:pb>pa?owner[b.roster_id]:null}); } });
      if (lg.status==="complete") cache.set(ck,rows);
    }
    out.push(...rows);
  }
  return out;
}
async function headToHead(uidA, uidB){
  const rows = await allMeetings(); const out=[];
  for (const r of rows){ if(r.ua===uidA&&r.ub===uidB) out.push(r); else if(r.ua===uidB&&r.ub===uidA) out.push({...r, ua:r.ub, ub:r.ua, pa:r.pb, pb:r.pa}); }
  return out;
}
function userGameStats(uid, rows){ // Sleeper-era per-game stats from all meetings (regular season)
  const g=[]; const byWk={};
  for (const r of rows){ if(!r.final||r.playoff) continue; const k=`${r.season}-${r.week}`; (byWk[k] ||= []).push(r.pa, r.pb); if(r.ua===uid) g.push({pts:r.pa, k, season:r.season, week:r.week}); else if(r.ub===uid) g.push({pts:r.pb, k, season:r.season, week:r.week}); }
  if(!g.length) return null;
  let apW=0, apL=0; for (const x of g){ for (const o of byWk[x.k]){ if(o>x.pts) apL++; else if(o<x.pts) apW++; } apW-=0; } // self compare is equal → ignored
  const hi=g.reduce((m,x)=>x.pts>m.pts?x:m,g[0]);
  return { ppg: g.reduce((s,x)=>s+x.pts,0)/g.length, hi, ap: apW+apL? apW/(apW+apL):0, games:g.length };
}
async function drawH2HTab(){
  const body=$("#rbBody");
  const mgrs = S.career.rows.filter(r=>r.uid).sort((a,b)=>a.name.localeCompare(b.name));
  if (mgrs.length<2){ body.innerHTML=`<div class="empty">Need at least two managers with Sleeper data.</div>`; return; }
  // defaults: me vs this week's opponent
  if (!S.h2hA){ const myUid = S.me && S.teams[S.me.roster_id]?.user?.user_id; let opp=null;
    const m=S.matchups[`${S.leagueId}:${S.week}`]; if (myUid && m){ const mine=m.find(x=>x.roster_id===S.me.roster_id); const o=mine && m.find(x=>x.matchup_id===mine.matchup_id && x.roster_id!==mine.roster_id); opp = o && S.teams[o.roster_id]?.user?.user_id; }
    S.h2hA = (myUid && mgrs.find(r=>r.uid===myUid)?.uid) || mgrs[0].uid; S.h2hB = (opp && opp!==S.h2hA && mgrs.find(r=>r.uid===opp)?.uid) || mgrs.find(r=>r.uid!==S.h2hA).uid; }
  const opt = sel => mgrs.map(r=>`<option value="${r.uid}" ${r.uid===sel?"selected":""}>${esc(r.name)}</option>`).join("");
  body.innerHTML = `<div class="h2hpick"><select id="hA">${opt(S.h2hA)}</select><button class="btn ghost" id="hSwap" title="Swap">⇄</button><select id="hB">${opt(S.h2hB)}</select></div><div id="h2hOut">${skel(5)}</div>`;
  $("#hA").onchange=e=>{ S.h2hA=e.target.value; drawH2HTab(); }; $("#hB").onchange=e=>{ S.h2hB=e.target.value; drawH2HTab(); };
  $("#hSwap").onclick=()=>{ [S.h2hA,S.h2hB]=[S.h2hB,S.h2hA]; drawH2HTab(); };
  if (S.h2hA===S.h2hB){ $("#h2hOut").innerHTML=`<div class="empty">Pick two different managers.</div>`; return; }
  const A=mgrs.find(r=>r.uid===S.h2hA), B=mgrs.find(r=>r.uid===S.h2hB);
  const rows = await allMeetings(); const meets = (await headToHead(A.uid,B.uid)).filter(x=>x.final).sort((x,y)=>y.season-x.season||y.week-x.week);
  const wA=meets.filter(x=>x.winner===A.uid).length, wB=meets.filter(x=>x.winner===B.uid).length, ties=meets.length-wA-wB;
  let streak=""; if(meets.length){ const first=meets[0].winner; let n=0; for (const x of meets){ if(x.winner===first&&first) n++; else break; } if(first&&n) streak=`${(first===A.uid?A:B).name} has won the last ${n}`; }
  const margins = meets.map(x=>x.pa-x.pb); const avgM = margins.length? margins.reduce((s,x)=>s+x,0)/margins.length : 0;
  const bigA = meets.filter(x=>x.winner===A.uid).sort((x,y)=>(y.pa-y.pb)-(x.pa-x.pb))[0], bigB = meets.filter(x=>x.winner===B.uid).sort((x,y)=>(y.pb-y.pa)-(x.pb-x.pa))[0];
  const gA=userGameStats(A.uid,rows), gB=userGameStats(B.uid,rows);
  const av = uid => { const u=Object.values(S.teams).find(t=>t.user?.user_id===uid); return u? `<img src="${u.avatar}" alt="">` : ""; };
  // this week's game?
  let live=""; const cm=S.matchups[`${S.leagueId}:${S.week}`]; if (cm){ const ra=Object.values(S.teams).find(t=>t.user?.user_id===A.uid)?.roster.roster_id, rb=Object.values(S.teams).find(t=>t.user?.user_id===B.uid)?.roster.roster_id; const xa=cm.find(x=>x.roster_id===ra), xb=cm.find(x=>x.roster_id===rb); if(xa&&xb&&xa.matchup_id===xb.matchup_id) live=`<div class="card gotw" style="margin-bottom:16px"><div class="tag">They play this week</div>${muHtml(xa,xb,S.week).replace(/role="button" tabindex="0"/,"")}</div>`; }
  const stat = (label, va, vb, fmtv=v=>v, higher=true, note="", ca=va, cb=vb) => { const ea = ca!=null&&cb!=null&&ca!==cb ? ((ca>cb)===higher) : null; return `<tr><td class="num ${ea===true?"edge":""}">${va==null?"·":fmtv(va)}</td><td class="lbl">${label}${note?`<div class="muted" style="font-size:11px;font-weight:400">${note}</div>`:""}</td><td class="num l ${ea===false?"edge":""}">${vb==null?"·":fmtv(vb)}</td></tr>`; };
  const recS = r => `${r.wins}-${r.losses}${r.ties?"-"+r.ties:""}`;
  const seasons = S.career.chain.map(l=>l.season).sort((x,y)=>y-x);
  const finish = (st,y) => !st? "·" : (isCurrentSeason() && String(y)===String(S.league.season)) ? "In progress" : st.titles? "🏆 Champion" : st.seconds? "🥈 Runner-up" : st.thirds? "🥉 Third" : st.papps? "Playoffs" : "Missed";
  const meetIn = (season) => { const m=meets.filter(x=>x.season===season); if(!m.length) return "·"; return m.map(x=>`<span class="${x.winner===A.uid?"s-won":x.winner===B.uid?"s-lost":""}">${x.winner===A.uid?"W":x.winner===B.uid?"L":"T"} ${fmt(x.pa)}–${fmt(x.pb)}</span>`).join("<br>"); };
  $("#h2hOut").innerHTML = `${live}
    <div class="card series"><div class="srow-h"><div class="who">${av(A.uid)}<b>${esc(A.name)}</b></div><div class="mid"><div class="big">${meets.length?`${wA}–${wB}${ties?`–${ties}`:""}`:"0–0"}</div><div class="lbl">${meets.length? (wA>wB?`${esc(A.name)} leads`:wB>wA?`${esc(B.name)} leads`:"Series tied") : "No meetings yet"} · Sleeper era</div>${streak?`<div class="muted" style="font-size:13px;margin-top:4px">${esc(streak)}</div>`:""}</div><div class="who r"><b>${esc(B.name)}</b>${av(B.uid)}</div></div>
      ${meets.length?`<div class="row" style="justify-content:center;gap:24px;margin-top:12px;font-size:13px;color:var(--sub)"><span>Avg margin <b class="${avgM>0?"s-won":avgM<0?"s-lost":""}">${avgM>0?"+":""}${avgM.toFixed(1)}</b> for ${esc(A.name)}</span>${bigA?`<span>Biggest ${esc(A.name)} win: <b>${fmt(bigA.pa-bigA.pb)}</b> (${bigA.season} wk ${bigA.week})</span>`:""}${bigB?`<span>Biggest ${esc(B.name)} win: <b>${fmt(bigB.pb-bigB.pa)}</b> (${bigB.season} wk ${bigB.week})</span>`:""}</div>`:""}
      ${meets.length?`<div style="margin-top:14px">${meets.map(x=>`<div class="meet"><span>${x.season} · Week ${x.week}${x.playoff?" · Playoffs":""}</span><span><span class="${x.winner===A.uid?"w":""}">${esc(A.name)} ${fmt(x.pa)}</span> – <span class="${x.winner===B.uid?"w":""}">${fmt(x.pb)} ${esc(B.name)}</span></span></div>`).join("")}</div>`:""}
    </div>
    <h3 style="margin-top:22px">Career</h3>
    <div class="card" style="padding:4px 8px"><table class="cmp"><thead><tr><th class="num">${esc(A.name)}</th><th></th><th class="num l">${esc(B.name)}</th></tr></thead><tbody>
      ${stat("Record", recS(A), recS(B), v=>v, true, "", pctOf(A), pctOf(B))}
      ${stat("Win %", pctOf(A), pctOf(B), v=>(v*100).toFixed(1))}
      ${stat("Championships", A.titles, B.titles)}
      ${stat("Finals", A.finals, B.finals)}
      ${stat("Playoff appearances", A.papps, B.papps)}
      ${stat("Playoff record", A.papps?`${A.pw}-${A.pl}`:null, B.papps?`${B.pw}-${B.pl}`:null, v=>v, true, "", A.papps?A.pw-A.pl:null, B.papps?B.pw-B.pl:null)}
      ${stat("Seasons", A.seasons, B.seasons)}
      ${stat("Best season", A.sl?.best?.rec, B.sl?.best?.rec, v=>v, true, "Sleeper era", A.sl?.best?.pct, B.sl?.best?.pct)}
      ${stat("Points per game", gA?.ppg, gB?.ppg, v=>fmt(v), true, "Sleeper era")}
      ${stat("Highest week", gA?.hi?.pts, gB?.hi?.pts, v=>fmt(v), true, "Sleeper era")}
      ${stat("All-play %", gA?.ap, gB?.ap, v=>(v*100).toFixed(1), true, "Sleeper era")}
    </tbody></table></div>
    <p class="muted" style="font-size:12.5px">Record, titles and playoff numbers go back to 2018 through the league record book. Per-game stats and the series record only cover Sleeper seasons.</p>
    <h3 style="margin-top:22px">Season by season</h3>
    <div class="card" style="padding:4px 8px"><div class="rb"><table style="min-width:640px"><thead><tr><th>Season</th><th>${esc(A.name)}</th><th>Finish</th><th>Head to head</th><th>${esc(B.name)}</th><th>Finish</th></tr></thead><tbody>
      ${seasons.map(y=>{ const sa=S.career.perSeason[y]?.[A.uid], sb_=S.career.perSeason[y]?.[B.uid]; if(!sa&&!sb_) return ""; return `<tr><td class="num" style="text-align:left">${y}</td><td>${sa?`${sa.wins}-${sa.losses}`:"·"}</td><td class="muted">${finish(sa,y)}</td><td style="font-size:13px">${meetIn(y)}</td><td>${sb_?`${sb_.wins}-${sb_.losses}`:"·"}</td><td class="muted">${finish(sb_,y)}</td></tr>`; }).join("")}
    </tbody></table></div></div>`;
}
async function sleeperSeasonStats(lg){
  const ck=`ffl_sstats2_${lg.league_id}`; const c=cache.get(ck); if(c && lg.status==="complete") return c;
  const isThis = lg.league_id===S.leagueId;
  const [users, rosters, wb] = await Promise.all([
    isThis ? Object.values(S.users) : j(`${API}/league/${lg.league_id}/users`),
    isThis ? S.rosters : j(`${API}/league/${lg.league_id}/rosters`),
    j(`${API}/league/${lg.league_id}/winners_bracket`).catch(()=>[])
  ]);
  const um = Object.fromEntries(users.map(u=>[u.user_id,u])); const out={}; const byR={};
  for (const r of rosters){ if(!r.owner_id) continue; const u=um[r.owner_id]||{}; byR[r.roster_id]=r.owner_id;
    out[r.owner_id]={name:u.display_name||"?", wins:r.settings?.wins||0, losses:r.settings?.losses||0, ties:r.settings?.ties||0, pf:(r.settings?.fpts||0)+(r.settings?.fpts_decimal||0)/100, titles:0,finals:0,seconds:0,thirds:0,papps:0,pw:0,pl:0}; }
  const inPl = new Set();
  for (const gm of wb){ for (const t of [gm.t1,gm.t2]) if(t) inPl.add(t);
    const W=out[byR[gm.w]], L=out[byR[gm.l]];
    if (gm.w && W){ W.pw++; } if (gm.l && L){ L.pl++; }
    if (gm.p===1){ for (const t of [gm.t1,gm.t2]) if(t&&out[byR[t]]) out[byR[t]].finals++; if(gm.w&&W) W.titles++; if(gm.l&&L) L.seconds++; }
    if (gm.p===3 && gm.w && W) W.thirds++;
  }
  for (const rid of inPl) if(out[byR[rid]]) out[byR[rid]].papps++;
  if (lg.status==="complete") cache.set(ck,out);
  return out;
}

/* ================= AUTH (Supabase) ================= */
function hideAll(){ document.querySelectorAll("main section").forEach(x=>x.hidden=true); $("#nav").style.display="none"; }
function renderLogin(mode="in", msg=""){
  hideAll(); const sec=$("#t-setup"); sec.hidden=false;
  sec.innerHTML = `<div class="auth card">
    <h2>${esc(S.league?.name||"League Clubhouse")}</h2><div class="muted">Members only. Sign in to continue.</div>
    <div class="tabs"><button data-m="in" class="${mode==="in"?"on":""}">Sign in</button><button data-m="up" class="${mode==="up"?"on":""}">Create account</button></div>
    ${mode==="up"?`<input id="su" placeholder="Sleeper username" autocomplete="off">`:""}
    <input id="em" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Password${mode==="up"?" (8+ characters)":""}" autocomplete="${mode==="up"?"new-password":"current-password"}">
    <button class="btn brass" id="go">${mode==="in"?"Sign in":"Create account"}</button>
    ${mode==="in"?`<button class="link" id="forgot">Forgot password?</button>`:""}
    <div class="msg muted" id="amsg">${esc(msg)}</div></div>`;
  sec.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>renderLogin(b.dataset.m));
  const m=$("#amsg");
  $("#go").onclick = async ()=>{
    const email=$("#em").value.trim(), password=$("#pw").value; m.textContent="";
    if (mode==="up"){
      const uname=$("#su").value.trim(); if(!uname){ m.textContent="Enter your Sleeper username."; return; }
      const found = await findRoster(uname); if (found.error){ m.textContent=found.error; return; }
      sessionStorage.setItem("ffl_pending_user", uname);
    }
    $("#go").disabled=true;
    const {data,error} = mode==="in" ? await sb.auth.signInWithPassword({email,password}) : await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
    if (error){ m.textContent=error.message; $("#go").disabled=false; return; }
    if (mode==="up" && !data.session){ m.textContent="Check your email to confirm your account, then sign in."; $("#go").disabled=false; return; }
    S.session=data.session; afterAuth();
  };
  $("#pw").onkeydown=e=>{ if(e.key==="Enter") $("#go").click(); };
  const f=$("#forgot"); if(f) f.onclick=async()=>{ const email=$("#em").value.trim(); if(!email){ m.textContent="Enter your email first."; return; } const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); m.textContent=error?error.message:"Reset link sent. Check your email."; };
}
function renderNewPassword(){
  hideAll(); const sec=$("#t-setup"); sec.hidden=false;
  sec.innerHTML=`<div class="auth card"><h2>Set a new password</h2><input id="pw" type="password" placeholder="New password" autocomplete="new-password"><button class="btn brass" id="go">Save password</button><div class="msg muted" id="amsg"></div></div>`;
  $("#go").onclick=async()=>{ const {error}=await sb.auth.updateUser({password:$("#pw").value}); if(error){ $("#amsg").textContent=error.message; return; } const {data}=await sb.auth.getSession(); S.session=data.session; afterAuth(); };
}
function renderJoin(msg=""){
  hideAll(); const sec=$("#t-setup"); sec.hidden=false;
  const pending = sessionStorage.getItem("ffl_pending_user")||"";
  sec.innerHTML=`<div class="auth card"><h2>Claim your team</h2><div class="muted">Enter your Sleeper username and the league invite code from your commissioner. Your team is matched from Sleeper automatically.</div>
    <input id="ju" placeholder="Sleeper username" autocomplete="off" value="${esc(pending)}">
    <div id="jprev" class="msg muted"></div>
    <input id="jc" placeholder="Invite code" autocomplete="off"><button class="btn brass" id="go">Join league</button>
    <button class="link" id="so">Sign out</button><div class="msg muted" id="amsg">${esc(msg)}</div></div>`;
  const preview = async ()=>{ const u=$("#ju").value.trim(); const pv=$("#jprev"); if(!u){ pv.textContent=""; return; } const f=await findRoster(u); pv.innerHTML = f.error ? esc(f.error) : `Your team: <b>${esc(S.teams[f.roster_id].name)}</b>`; };
  $("#ju").onblur=preview; if(pending) preview();
  $("#go").onclick=async()=>{
    const uname=$("#ju").value.trim(); const f=await findRoster(uname); if(f.error){ $("#amsg").textContent=f.error; return; }
    $("#go").disabled=true;
    const {data,error}=await sb.rpc("join_league",{p_league_id:S.leagueId, p_roster_id:f.roster_id, p_code:$("#jc").value.trim(), p_sleeper_username:f.username, p_sleeper_user_id:f.user_id});
    if(error){ $("#amsg").textContent=error.message.replace(/^.*?: /,""); $("#go").disabled=false; return; }
    sessionStorage.removeItem("ffl_pending_user"); S.me={roster_id:data.roster_id, user_id:S.session.user.id}; enter(); };
  $("#so").onclick=signOut;
}
/* Sleeper username -> roster in this league (owner or co-owner). */
async function findRoster(username){
  let u; try{ u = await j(`${API}/user/${encodeURIComponent(username)}`); }catch{ return {error:"No Sleeper account with that username."}; }
  if (!u?.user_id) return {error:"No Sleeper account with that username."};
  const r = S.rosters.find(x => x.owner_id===u.user_id || (x.co_owners||[]).includes(u.user_id));
  if (!r) return {error:`${u.display_name} is not a manager in this league.`};
  return {roster_id:r.roster_id, username:u.display_name, user_id:u.user_id};
}
async function signOut(){ await sb.auth.signOut(); S.session=null; S.me=null; location.hash=""; location.reload(); }
async function afterAuth(){
  try{
    const rows = await DB.q("profiles", `league_id=eq.${S.leagueId}&user_id=eq.${S.session.user.id}&select=roster_id,user_id,is_commissioner`);
    if (!rows.length) return renderJoin();
    S.me = rows[0]; enter();
  }catch(e){ renderLogin("in", e.message); }
}
function drawAcct(){
  const a=$("#acct"); if(!sb||!S.me){ a.innerHTML=""; return; }
  const t=S.teams[S.me.roster_id];
  a.innerHTML=`<div class="acct"><span class="ellip" style="max-width:160px">${esc(t?.name||"Member")}</span><img src="${t?.avatar||""}" alt=""><button id="soBtn">Sign out</button></div>`;
  $("#soBtn").onclick=signOut;
}
function enter(){
  $("#nav").style.display=""; $("#t-setup").hidden=true;
  drawAcct();
  Object.keys(rendered).forEach(k=>delete rendered[k]);
  const tab = location.hash.replace("#","") || "score";
  show(["score","stand","trophy","book","tx","draft","records"].includes(tab)?tab:"score");
}

/* ================= SETUP / BOOT ================= */
function renderSetup(){
  document.querySelectorAll("main section").forEach(s=>s.hidden=true);
  const sec=$("#t-setup"); sec.hidden=false;
  sec.innerHTML=`<div class="setup card"><h2>Connect your league</h2><p class="muted">Enter your Sleeper username to find your leagues, or paste a league ID directly. To make this permanent, put the ID in the CONFIG block at the top of index.html.</p>
    <label for="su">Sleeper username</label><div class="row"><input id="su" placeholder="username"><button class="btn" id="suGo">Find leagues</button></div><div id="suList" style="margin-top:10px"></div>
    <label for="lid">Or league ID</label><div class="row"><input id="lid" placeholder="1124839220367605760"><button class="btn brass" id="lidGo">Open</button></div></div>`;
  $("#lidGo").onclick=()=>{ const v=$("#lid").value.trim(); if(v) location.href=`?league=${v}`; };
  $("#suGo").onclick=async()=>{ const list=$("#suList"); list.textContent="Looking…"; try{ const u=await j(`${API}/user/${encodeURIComponent($("#su").value.trim())}`); const st=await j(`${API}/state/nfl`); const ls=await j(`${API}/user/${u.user_id}/leagues/nfl/${st.league_season}`); list.innerHTML = ls.length? ls.map(l=>`<div class="row spread" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)"><span>${esc(l.name)} <span class="muted">(${l.total_rosters} teams)</span></span><a class="btn ghost" style="text-decoration:none;font-size:15px;padding:5px 10px" href="?league=${l.league_id}">Open</a></div>`).join("") : "No leagues found for this season."; }catch(e){ list.textContent="User not found."; } };
}
(async function boot(){
  $("#ver").textContent = VERSION;
  const q = new URLSearchParams(location.search).get("league");
  S.leagueId = q || CONFIG.LEAGUE_ID || cache.get("ffl_last_league");
  if (!S.leagueId){ $("#lgSub").textContent="No league connected"; renderSetup(); return; }
  try{
    await loadLeague(); cache.set("ffl_last_league", S.leagueId);
    S.playersReady = loadPlayers(); // background; lineups and transactions await it
    if (sb){
      sb.auth.onAuthStateChange((ev)=>{ if (ev==="PASSWORD_RECOVERY") renderNewPassword(); });
      const {data} = await sb.auth.getSession(); S.session = data.session;
      if (!S.session) return renderLogin();
      return afterAuth();
    }
    enter();
  }catch(e){
    $("#lgSub").textContent="Could not reach Sleeper";
    $("#alert").innerHTML=`<div class="err" style="margin-bottom:16px">Could not load league ${esc(S.leagueId)}: ${esc(e.message)}. Check the league ID.</div>`;
    renderSetup();
  }
})();
